services:
  # Kotlin Analyzer - gRPC server for code analysis
  analyzer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analyzer
    container_name: analyzer-server
    ports:
      - "50051:50051"
    volumes:
      # Mount the SourceIntelligence directory so all projects are accessible
      # Inside container: /projects/testdata/kickstarter
      - C:/Users/Phil/Documents/Playground/SourceIntelligence:/projects:ro
    environment:
      - GRPC_PORT=50051
      - JAVA_OPTS=-Xmx4g -XX:+UseG1GC
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: memgraph-db
    ports:
      - "7687:7687"   # Bolt protocol
      - "7444:7444"   # WebSocket for Lab
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
      - C:/Users/Phil/Documents/Playground/SourceIntelligence/import_data:/var/lib/memgraph/import
    command: ["--log-level=WARNING"]
    healthcheck:
      test: ["CMD", "mg_client", "--host", "localhost", "--port", "7687", "--execute", "RETURN 1;"]
      interval: 10s
      timeout: 5s
      retries: 5
    pull_policy: always

  lab:
    image: memgraph/lab:latest
    container_name: memgraph-lab
    ports:
      - "3000:3000"
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    pull_policy: always

volumes:
  memgraph_data:
  memgraph_log:
